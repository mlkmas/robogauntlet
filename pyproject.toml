[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robogauntlet"
version = "0.1.0"
description = "Adaptive stress testing for robot policies on Nebius, powered by NVIDIA Nemotron, Cosmos and GR00T"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.5",
  "numpy>=1.26",
  "scikit-learn>=1.3",
  "openai>=1.40",
  "requests>=2.31",
  "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
robogauntlet = "robogauntlet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
